; Runs the FastAPI backend and the OpenWA gateway as two independent processes
; in one container. autorestart=true per-program is the whole point: the
; gateway is an unofficial WhatsApp client with real crash/ban risk, and it
; must never be able to take checkout/orders down with it.
[supervisord]
nodaemon=true
user=root

[program:backend]
; %(ENV_PORT)s — Render injects PORT for whichever port it health-checks and
; routes public traffic to. This is the one process on that port.
command=uvicorn server:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app/backend
autostart=true
autorestart=true
priority=1
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openwa]
command=node dist/main
directory=/app/openwa
autostart=true
autorestart=true
priority=2
startsecs=5
; Shadow the container-wide $PORT (Render's, meant for `backend` above) with
; the gateway's own fixed internal port — without this override it would try
; to bind Render's dynamic port instead of the 2785 wa_openwa.py expects.
environment=PORT="2785",API_PORT="2785"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
